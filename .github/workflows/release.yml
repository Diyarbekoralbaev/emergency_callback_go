name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o emergency-callback_linux_amd64 ./cmd/emergency-callback
          sha256sum emergency-callback_linux_amd64 > checksums.txt
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" emergency-callback_linux_amd64 checksums.txt --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
