; Callee mini-Asterisk.
; FreePBX'ga ikkita extension sifatida registratsiya qiladi (200=bemor,
; 337=operator), lekin kiruvchi INVITE'lar bitta [fpbx] endpoint orqali
; qabul qilinadi (manba IP bo'yicha identify) va dialplan ${EXTEN} bo'yicha
; ajratadi.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- registratsiyalar (FreePBX contact'larni bilishi uchun) ---
[reg200]
type=registration
outbound_auth=auth200
server_uri=sip:172.28.0.20
client_uri=sip:200@172.28.0.20
contact_user=200
retry_interval=10
forbidden_retry_interval=10
expiration=120

[auth200]
type=auth
auth_type=userpass
username=200
password=labpass200

[reg337]
type=registration
outbound_auth=auth337
server_uri=sip:172.28.0.20
client_uri=sip:337@172.28.0.20
contact_user=337
retry_interval=10
forbidden_retry_interval=10
expiration=120

[auth337]
type=auth
auth_type=userpass
username=337
password=labpass337

; --- kiruvchi qo'ng'iroqlar uchun yagona endpoint ---
[fpbx]
type=endpoint
context=incoming
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733

[fpbx-identify]
type=identify
endpoint=fpbx
match=172.28.0.20
