; Callee dialplan — test skript global o'zgaruvchilar bilan boshqaradi:
;   dialplan set global DTMF_SEQ ww4ww0   (w = 0.5s pauza, raqamlar = DTMF)
;   dialplan set global ANSWER_DELAY 1    (javobgacha soniya)
;   dialplan set global OP_MODE answer    (operator: answer | busy | noanswer)
[globals]
DTMF_SEQ=
ANSWER_DELAY=1
OP_MODE=answer
WAIT_AFTER=8    ; DTMF yuborilgach go'shakni qo'yishgacha soniya

[incoming]
; 200 — "bemor": javob beradi, DTMF_SEQ yuboradi, kutadi
exten => 200,1,NoOp(CALLEE ring DTMF_SEQ=${GLOBAL(DTMF_SEQ)})
 same => n,Wait(${GLOBAL(ANSWER_DELAY)})
 same => n,Answer()
 same => n,Wait(2)
 same => n,GotoIf($["${GLOBAL(DTMF_SEQ)}" = ""]?silent)
 same => n,SendDTMF(${GLOBAL(DTMF_SEQ)},300)
 same => n,Wait(${GLOBAL(WAIT_AFTER)})
 same => n,Hangup()
 same => n(silent),Wait(25)
 same => n,Hangup()

; 337 — "operator"
exten => 337,1,NoOp(OPERATOR ring OP_MODE=${GLOBAL(OP_MODE)})
 same => n,GotoIf($["${GLOBAL(OP_MODE)}" = "busy"]?busy)
 same => n,GotoIf($["${GLOBAL(OP_MODE)}" = "noanswer"]?noans)
 same => n,Answer()
 same => n,Wait(60)
 same => n,Hangup()
 same => n(busy),Busy(10)
 same => n(noans),Ringing()
 same => n,Wait(30)
 same => n,Hangup()

; 777 ham operator (ARI backend OperatorQueue default'i)
exten => 777,1,Goto(337,1)
